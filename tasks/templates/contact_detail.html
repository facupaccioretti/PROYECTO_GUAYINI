{% extends 'base.html' %}

{% block content %}

<main class="container">
  <div class="row">
    <div class="col-md-4 offset-md-4">
      <h4>{{ contact.name }}</h4>
      {{ error }}
      <div>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
  
          <button class="btn btn-primary">
            Update
          </button>
        </form>
  
        <form action="{% url 'complete_contact' contact.id %}" method="POST">
          {% csrf_token %}
          <button class="btn btn-success">
            Complete
          </button>
        </form>
  
        <form action="{% url 'delete_contact' contact.id %}" method="POST">
          {% csrf_token %}
          <button class="btn btn-danger">
            Delete
          </button>
        </form>
      </div>
    </div>
  </div>
</main>

{% endblock %}
