{% extends 'base.html' %}

{% load static %}


{% block content %}

<main class="container">
    <div class="row">
        <section class="col-md-4 offset-md-4 mt-3">
            <form action="/signin/", method = "POST" class="card card-body">
                {{error}}
                {% csrf_token %}
                <div style="text-align: center">
                    <img src="/static/images/LOGO GUAYINI ESCRITO FONDO BLANCO.png" width="300" height="90" alt="">
                </div>
                <hr>
                <h4 class="text-center"> Sign in into GUAYINI </h4>
                {{error}}
                {% csrf_token %}
                <div class="mb-3" >
                    <label for="username">Username:</label>
                    <input type="text" name="username" id= "username" class="form-control" placeholder="Write your username">
                </div>
                <div class="mb-3">
                    <label for="password">Password:</label>
                    <input type="password" name="password" id= "password" class="form-control" placeholder="Write your password">
                </div>
                <button class="btn btn-primary">
                    Continue
                    {% csrf_token %}
                </button>
            </form>
        </section>
    </div>
</main>

{% endblock %}
