{% extends 'base.html' %} {% load static %} {% block content %}

<main class="container">
  <div class="row">
    <section class="col-md-4 offset-md-4 mt-3">
      <form action="/signin/" , method="POST" class="card card-body">
        {{error}} {% csrf_token %}
        <div style="text-align: center">
          <img
            src="/static/images/LOGO GUAYINI ESCRITO FONDO BLANCO.png"
            width="300"
            height="90"
            alt=""
          />
        </div>
        <hr />
        <h4 class="text-center">Inicie sesión en GUAYINI</h4>
        <div class="mb-3">
          <label for="username">Nombre de usuario:</label>
          <input
            type="text"
            name="username"
            id="username"
            class="form-control"
            placeholder="Write your username"
          />
        </div>
        <div class="mb-3">
          <label for="password">Contraseña:</label>
          <input
            type="password"
            name="password"
            id="password"
            class="form-control"
            placeholder="Write your password"
          />
        </div>
        <button class="btn btn-primary">Ingresar</button>
      </form>
    </section>
  </div>
</main>

{% endblock %}
