{% extends 'base.html' %}


{% block content %}


<main class="container py-5">
    <div class="col-md-6 offset-md-3">
        <h1 class="display-1 text-center"> WHATSAPP GROUPS </h1>     
    
      <ul class="list-group">
        {% for whatsappgroups in whatsappgroups %}
        <a class="list-group-item" href="{% url 'whatsappgroup_detail' whatsappgroups.id %}">
          <header class="d-flex justify-content-between">
            <h2 class="fw-bold text-primary">{{whatsappgroups.groupname}}</h2>
            <p>{{whatsappgroups.description}}</p>
          </header>
        </a>
        {% endfor %}
      </ul>
    </div>
</main>

{% endblock %}
