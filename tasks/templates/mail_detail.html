{% extends 'base.html' %} {% block content %}

<main class="container">
  <div class="row">
    <link
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css"
      rel="stylesheet"
    />
    <div class="container bootdey mt-2">
      <div class="email-app mb-4">
        <nav>
          <a href="{% url 'mails' %}" class="btn btn-danger btn-block"
            >Lista de Emails</a
          >
          <ul class="nav">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'mails' %}"
                ><i class="fa fa-inbox"></i> Programados
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'mail_completed' %}"
                ><i class="fa fa-rocket"></i> Enviados</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fa fa-bookmark"></i> Importantes</a
              >
            </li>
          </ul>
        </nav>
        <main class="inbox">
          <div class="toolbar">
            <div class="btn-group">
              <button type="button" class="btn btn-light">
                <span class="fa fa-envelope"></span>
              </button>
              <button type="button" class="btn btn-light">
                <span class="fa fa-star"></span>
              </button>
              <button type="button" class="btn btn-light">
                <span class="fa fa-star-o"></span>
              </button>
              <button type="button" class="btn btn-light">
                <span class="fa fa-bookmark-o"></span>
              </button>
            </div>
            <div class="btn-group">
              <button type="button" class="btn btn-light">
                <span class="fa fa-mail-reply"></span>
              </button>
              <button type="button" class="btn btn-light">
                <span class="fa fa-mail-reply-all"></span>
              </button>
              <button type="button" class="btn btn-light">
                <span class="fa fa-mail-forward"></span>
              </button>
            </div>
            <button type="button" class="btn btn-light">
              <span class="fa fa-trash-o"></span>
            </button>
            <div class="btn-group float-right">
              <button type="button" class="btn btn-light">
                <span class="fa fa-chevron-left"></span>
              </button>
              <button type="button" class="btn btn-light">
                <span class="fa fa-chevron-right"></span>
              </button>
            </div>
          </div>
            {{mail.tittle}} {{error}}
            <div class="row text align center">
              <form method="POST">
                {{ form.media }} {% csrf_token %} {{form.as_p}}

                <button class="btn btn-primary">Update</button>
              </form>

              <form action="{% url 'complete_mail' mail.id %}" method="POST">
                {% csrf_token %}
                <button class="btn btn-success">complete</button>
              </form>

              <form action="{% url 'delete_mail' mail.id %}" method="POST">
                {% csrf_token %}
                <button class="btn btn-danger">delete</button>
              </form>
            </div>
        </main>
      </div>
    </div>
  </div>
</main>

{% endblock %}
