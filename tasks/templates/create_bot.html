{% extends 'base.html' %} {% block content %}

<main>
  <div class="row">
    <div class="col-md-6 offset-md-3 mt-3 mb-3">
      <form
        action="/create_bot/"
        method="POST"
        class="card card-body"
        name="bot-form"
      >
        <h5>Create New Bot</h5>
        {% csrf_token %} {{ form.as_p }}
        <br />
        <button type="submit" class="btn btn-primary">Create Bot</button>
      </form>
    </div>
  </div>
</main>

{% endblock %}
