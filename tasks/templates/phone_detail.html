{% extends 'base.html' %}

{% block content %}

<main class="container">
  <div class="row">
    <div class="col-md-4 offset-md-4">
      {{phone.tittle}}

      <div>
        <form method="POST">
          {% csrf_token %}
          {{ form.media }}
          {{form.as_p}}
  
          <button class="btn btn-primary">
            Update
          </button>
        </form>
  
        <form action="{% url 'complete_phone' phone.id %}" method="POST">
          {% csrf_token %}
          <button class="btn btn-success">
            complete
          </button>
        </form>
  
        <form action="{% url 'delete_phone' phone.id %}" method="POST">
          {% csrf_token %}
          <button class="btn btn-danger">
            delete
          </button>
      </div>
      
      </form>
    </div>
  </div>

</main>

{% endblock %}
